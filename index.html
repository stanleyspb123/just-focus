<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="theme-color" content="#09090a" />
  <title>JUST FOCUS</title>
  <style>
    :root{
      --bg:#09090a;
      --fg:#f5f5f7;
      --muted:rgba(245,245,247,.55);
      --line:rgba(245,245,247,.15);
      --panel:rgba(255,255,255,.055);
      --panel-border:rgba(255,255,255,.10);
    }

    *{box-sizing:border-box}
    html,body{height:100%}

    body{
      margin:0;
      background:
        radial-gradient(circle at 50% 44%, rgba(255,255,255,.035), transparent 32%),
        var(--bg);
      color:var(--fg);
      font:16px/1.4 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow:hidden;
    }

    .app{
      width:100%;
      height:100%;
      position:relative;
      display:grid;
      place-items:center;
      isolation:isolate;
    }

    .brand{
      position:fixed;
      top:28px;
      left:50%;
      transform:translateX(-50%);
      font-size:12px;
      font-weight:700;
      letter-spacing:.22em;
      color:rgba(245,245,247,.42);
      user-select:none;
      z-index:5;
    }

    canvas#waves{
      position:fixed;
      inset:0;
      width:100vw;
      height:100vh;
      pointer-events:none;
      z-index:0;
    }

    .play-wrap{
      position:relative;
      z-index:2;
      width:260px;
      height:260px;
      display:grid;
      place-items:center;
    }

    #play{
      width:112px;
      height:112px;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.97);
      color:#09090a;
      display:grid;
      place-items:center;
      cursor:pointer;
      box-shadow:
        0 12px 46px rgba(0,0,0,.30),
        inset 0 0 0 1px rgba(255,255,255,.22);
      transition:transform .22s ease, box-shadow .35s ease, background .22s ease;
      -webkit-tap-highlight-color:transparent;
      outline:none;
      position:relative;
      z-index:3;
    }

    #play:hover{ transform:scale(1.035); }
    #play:active{ transform:scale(.985); }

    #play[data-playing="1"]{
      background:#f5f5f7;
      box-shadow:
        0 0 0 10px rgba(255,255,255,.018),
        0 0 90px rgba(255,255,255,.10),
        0 12px 46px rgba(0,0,0,.30);
    }

    .icon{
      width:30px;
      height:30px;
      position:relative;
      display:block;
    }

    .icon::before,
    .icon::after{
      content:"";
      position:absolute;
      inset:0;
      margin:auto;
      transition:all .2s ease;
    }

    #play[data-playing="0"] .icon::before{
      width:0;
      height:0;
      border-top:15px solid transparent;
      border-bottom:15px solid transparent;
      border-left:22px solid #09090a;
      transform:translateX(3px);
    }

    #play[data-playing="0"] .icon::after{ display:none; }

    #play[data-playing="1"] .icon::before,
    #play[data-playing="1"] .icon::after{
      width:7px;
      height:28px;
      background:#09090a;
      border-radius:2px;
      top:1px;
      bottom:auto;
    }

    #play[data-playing="1"] .icon::before{ left:5px; right:auto; }
    #play[data-playing="1"] .icon::after{ right:5px; left:auto; }


    .panel{
      position:fixed;
      left:50%;
      bottom:28px;
      transform:translateX(-50%);
      z-index:5;
      width:min(1180px, calc(100vw - 40px));
      padding:0;
      border:none;
      border-radius:0;
      background:transparent;
      backdrop-filter:none;
      -webkit-backdrop-filter:none;
      box-shadow:none;
      display:grid;
      grid-template-columns:1fr 1fr 1.25fr;
      gap:0;
      align-items:center;
    }

    .panel > *{
      padding:0 24px;
      min-height:56px;
      display:flex;
      align-items:center;
    }

    .panel > * + *{
      border-left:1px solid rgba(255,255,255,.12);
    }

    .control{
      display:grid;
      grid-template-columns:auto 1fr auto;
      gap:14px;
      align-items:center;
      min-width:0;
      width:100%;
    }

    .control-title{
      font-size:11px;
      font-weight:650;
      letter-spacing:.16em;
      text-transform:uppercase;
      color:rgba(245,245,247,.60);
      white-space:nowrap;
    }

    .value{
      font-variant-numeric:tabular-nums;
      font-size:13px;
      color:rgba(245,245,247,.70);
      min-width:58px;
      text-align:right;
      white-space:nowrap;
    }

    input[type="range"]{
      appearance:none;
      width:100%;
      height:26px;
      background:transparent;
      cursor:pointer;
      outline:none;
    }

    input[type="range"]::-webkit-slider-runnable-track{
      height:2px;
      background:rgba(255,255,255,.24);
      border-radius:999px;
    }

    input[type="range"]::-webkit-slider-thumb{
      appearance:none;
      width:15px;
      height:15px;
      margin-top:-6.5px;
      border-radius:50%;
      background:#f5f5f7;
      box-shadow:0 0 0 3px rgba(255,255,255,.08);
    }

    input[type="range"]::-moz-range-track{
      height:2px;
      background:rgba(255,255,255,.24);
      border-radius:999px;
    }

    input[type="range"]::-moz-range-thumb{
      width:15px;
      height:15px;
      border:none;
      border-radius:50%;
      background:#f5f5f7;
      box-shadow:0 0 0 3px rgba(255,255,255,.08);
    }

    .styles{
      display:flex;
      justify-content:flex-end;
      gap:10px;
      flex-wrap:nowrap;
      width:100%;
    }

    .style-btn{
      appearance:none;
      border:1px solid rgba(255,255,255,.14);
      background:transparent;
      color:rgba(245,245,247,.68);
      border-radius:999px;
      min-width:78px;
      padding:11px 16px;
      font-weight:560;
      font-size:13px;
      cursor:pointer;
      transition:background .18s ease, color .18s ease, transform .18s ease, border-color .18s ease;
    }

    .style-btn:hover{ transform:translateY(-1px); }
    .style-btn[aria-pressed="true"]{
      background:#f5f5f7;
      color:#09090a;
      border-color:#f5f5f7;
      box-shadow:0 8px 24px rgba(255,255,255,.05);
    }

    .mobile-label{
      display:none;
      font-size:12px;
      color:var(--muted);
      margin-bottom:4px;
    }

    @media (max-width: 820px){
      .brand{top:20px}
      .panel{
        bottom:16px;
        width:calc(100vw - 28px);
        grid-template-columns:1fr;
        gap:10px;
      }
      .panel > *{
        padding:0;
        min-height:44px;
      }
      .panel > * + *{
        border-left:none;
        border-top:1px solid rgba(255,255,255,.08);
        padding-top:10px;
      }
      .control{grid-template-columns:86px 1fr 54px; gap:10px}
      .styles{justify-content:flex-start; flex-wrap:wrap}
      .style-btn{min-width:72px; padding:9px 14px}
      .mobile-label{display:block}
      .play-wrap{transform:translateY(-74px)}

    }

    @media (max-height: 640px){
      .play-wrap{transform:scale(.86) translateY(-40px)}
      .panel{bottom:10px}
    }

    @media (prefers-reduced-motion: reduce){
      #play,.style-btn{transition:none}
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="brand">JUST FOCUS</div>
    <canvas id="waves"></canvas>

    <div class="play-wrap">
      <button id="play" data-playing="0" aria-label="Включить музыку для фокусировки">
        <span class="icon" aria-hidden="true"></span>
      </button>
</div>

    <section class="panel" aria-label="Настройки звука">
      <div class="control">
        <span class="control-title">Громкость</span>
        <input id="vol" type="range" min="0" max="100" value="39" />
        <span class="value" id="volValue">39</span>
      </div>

      <div class="control">
        <span class="control-title">Темп</span>
        <input id="bpm" type="range" min="54" max="108" step="1" value="76" />
        <span class="value"><span id="bpmValue">76</span> BPM</span>
      </div>

      <div>
        <div class="mobile-label">Стиль</div>
        <div class="styles" role="group" aria-label="Стиль звучания">
          <button class="style-btn" data-style="calm" aria-pressed="true">Calm</button>
          <button class="style-btn" data-style="warm" aria-pressed="false">Warm</button>
          <button class="style-btn" data-style="space" aria-pressed="false">Space</button>
          <button class="style-btn" data-style="zimmer" aria-pressed="false">Zimmer</button>
        </div>
      </div>
    </section>
  </main>
    <audio id="keep" playsinline preload="auto" loop style="position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0"></audio>
    <video id="keeperVideo" playsinline muted loop style="position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0"></video>



  <script>
  ;(() => {
    const canvas = document.getElementById('waves');
    const g = canvas.getContext('2d');
    const bpmEl = document.getElementById('bpm');

    let DPR=1,W=0,H=0,last=performance.now(),phase=0,energy=0;

    const rings = [
      {base:.115, spread:0,    alpha:.15, amp:10,  speed:1.00, width:1.0},
      {base:.155, spread:.018, alpha:.12, amp:14,  speed:.86,  width:.95},
      {base:.205, spread:.032, alpha:.09, amp:18,  speed:.72,  width:.85},
      {base:.265, spread:.050, alpha:.07, amp:23,  speed:.60,  width:.75},
      {base:.330, spread:.072, alpha:.05, amp:28,  speed:.50,  width:.65}
    ];

    function resize(){
      DPR=Math.min(2,Math.max(1,devicePixelRatio||1));
      W=canvas.width=Math.floor(innerWidth*DPR);
      H=canvas.height=Math.floor(innerHeight*DPR);
      canvas.style.width=innerWidth+'px';
      canvas.style.height=innerHeight+'px';
    }
    addEventListener('resize',resize,{passive:true});
    resize();

    function contour(cx,cy,r,t,amp,points=180){
      g.beginPath();
      for(let i=0;i<=points;i++){
        const a=(i/points)*Math.PI*2;
        const distort =
          Math.sin(a*2.0 + t*.55)*amp*.48 +
          Math.sin(a*3.0 - t*.90)*amp*.62 +
          Math.sin(a*5.0 + t*1.15)*amp*.22 +
          Math.sin(a*7.0 - t*.36)*amp*.10;

        const rr=r+distort;
        const x=cx+Math.cos(a)*rr;
        const y=cy+Math.sin(a)*rr;
        if(i===0) g.moveTo(x,y); else g.lineTo(x,y);
      }
      g.closePath();
    }

    function draw(now){
      const dt=Math.min(40,now-last);
      last=now;

      const playing=document.body.dataset.playing==='1';
      const bpm=+bpmEl.value||76;

      energy+=(Number(playing)-energy)*(playing?.04:.024);
      phase+=dt*(bpm/76)*.00165;

      g.clearRect(0,0,W,H);

      if(energy>.003){
        const cx=W/2, cy=H/2;
        const minDim=Math.min(W,H);

        // Ambient mist
        const mist=g.createRadialGradient(cx,cy,minDim*.03,cx,cy,minDim*.38);
        mist.addColorStop(0,`rgba(255,255,255,${.024*energy})`);
        mist.addColorStop(.55,`rgba(255,255,255,${.010*energy})`);
        mist.addColorStop(1,'rgba(255,255,255,0)');
        g.fillStyle=mist;
        g.fillRect(0,0,W,H);

        rings.forEach((R,i)=>{
          const t=phase*R.speed+i*.71;
          const breathe=(Math.sin(t*Math.PI*1.2)+1)/2;
          const radius=minDim*(R.base + R.spread*breathe);
          contour(cx,cy,radius,t,R.amp*DPR*(.72+.28*breathe));

          g.strokeStyle=`rgba(245,245,247,${R.alpha*energy})`;
          g.lineWidth=R.width*DPR;
          g.stroke();

          // very fine secondary trace creates a soft mesh feel
          if(i<4){
            contour(cx,cy,radius+4*DPR,t+.18,R.amp*DPR*.78);
            g.strokeStyle=`rgba(245,245,247,${R.alpha*.28*energy})`;
            g.lineWidth=.45*DPR;
            g.stroke();
          }
        });
      }

      requestAnimationFrame(draw);
    }

    requestAnimationFrame(draw);
  })();
  </script>

  <!-- AUDIO: recovered from the working justfocus.space build -->
  <script>

  (function(){
    const root=document.documentElement;
    const btn=document.getElementById('play'), hint=document.getElementById('hint');
    const keep=document.getElementById('keep'), keepVid=document.getElementById('keeperVideo');
    const vol=document.getElementById('vol'), volVal=document.getElementById('volValue');
    const tempoSlider=document.getElementById('bpm'), tempoVal=document.getElementById('bpmValue');
    const timer={value:0}, tmVal={textContent:''};
    const stylesBox=document.querySelector('.styles');

    let ac, master, comp, postHP, postLP, mediaDest, masterEQ1, masterHS;
    let playing=false, intervalClock=null;
    const nodes={};

    let tempoBpm=+tempoSlider.value, beat=60/tempoBpm, subdiv=2, stepDur=beat/subdiv;
    let nextNoteTime=0, stepIndex=0;

    const rootA=220, scale=[0,3,5,7,10,12];
    const prog=[ {chord:[0,7,12]}, {chord:[-8,0,5]}, {chord:[-12,-5,0]}, {chord:[-2,5,10]} ];
    const pick=a=>a[(Math.random()*a.length)|0], clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
    const noteToFreq=semi=>rootA*Math.pow(2,semi/12);

    let motif=null, barsUntilMotif=8;
    const STYLE={calm:{padLP:1150,revMix:.28,delFb:.09,delTimeMul:1/3,chorus:.10,rhythm:.10,shimmer:.010},
                 warm:{padLP:1220,revMix:.30,delFb:.10,delTimeMul:1/3,chorus:.11,rhythm:.11,shimmer:.011},
                 space:{padLP:1280,revMix:.32,delFb:.11,delTimeMul:1/2,chorus:.12,rhythm:.11,shimmer:.012},
                 zimmer:{padLP:1200,revMix:.33,delFb:.11,delTimeMul:1/2,chorus:.12,rhythm:.12,shimmer:.012}};
    let curStyle='calm';

    function morphToStyle(key, ramp=24){
      if(!ac||!STYLE[key]) return; curStyle=key; const s=STYLE[key], now=ac.currentTime;
      nodes.padLP.frequency.setTargetAtTime(s.padLP, now, ramp/6);
      nodes.revSend.gain.setTargetAtTime(s.revMix, now, ramp/6);
      nodes.dFB.gain.setTargetAtTime(s.delFb, now, ramp/6);
      nodes.delay.delayTime.cancelScheduledValues(now);
      nodes.delay.delayTime.setValueAtTime(nodes.delay.delayTime.value, now);
      nodes.delay.delayTime.linearRampToValueAtTime(Math.max(.22,(60/tempoBpm)*s.delTimeMul), now + ramp*0.6);
      nodes.chLG.setTargetAtTime(s.chorus, now, ramp/6);
      nodes.chRG.setTargetAtTime(s.chorus, now, ramp/6);
      nodes.rhythm.gain.setTargetAtTime(s.rhythm, now, ramp/6);
      nodes.shimG.gain.setTargetAtTime(s.shimmer, now, ramp/6);
    }

    function makeImpulse(seconds=3.6,decay=.7){
      const rate=ac.sampleRate,len=Math.floor(seconds*rate),buf=ac.createBuffer(2,len,rate);
      for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);for(let i=0;i<len;i++){d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay*4.5);}}
      return buf;
    }

    function createContextSync(){
      if(ac) return;
      ac=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'playback'});

      master=ac.createGain(); master.gain.value=0.0001;

      comp=ac.createDynamicsCompressor(); comp.threshold.value=-22; comp.knee.value=22; comp.ratio.value=2.2; comp.attack.value=.015; comp.release.value=.28;

      // Master cleaning EQ (мягко убираем «писк» и «гул»)
      masterEQ1=ac.createBiquadFilter(); masterEQ1.type='peaking'; masterEQ1.frequency.value=2400; masterEQ1.Q.value=1.0; masterEQ1.gain.value=-1.2;
      masterHS=ac.createBiquadFilter(); masterHS.type='highshelf'; masterHS.frequency.value=3800; masterHS.gain.value=-1.6;

      postHP=ac.createBiquadFilter(); postHP.type='highpass'; postHP.frequency.value=120; postHP.Q.value=.707; // ↑ срез низов
      postLP=ac.createBiquadFilter(); postLP.type='lowpass';  postLP.frequency.value=4800; postLP.Q.value=.707; // ↓ ограничение верха

      mediaDest=ac.createMediaStreamDestination();

      // master → comp → EQ → HP → LP → out(+MediaStream)
      master.connect(comp);
      comp.connect(masterEQ1).connect(masterHS).connect(postHP).connect(postLP);
      postLP.connect(ac.destination);
      postLP.connect(mediaDest);
      try{ keep.srcObject=mediaDest.stream; keep.muted=false; keep.volume=0.0001; }catch(_){}

      // лёгкий нудж для гарантии старта
      const t=ac.currentTime+0.02;
      const o=ac.createOscillator(), g=ac.createGain();
      o.type='sine'; o.frequency.value=440; g.gain.value=0.0006;
      o.connect(g).connect(master); o.start(t); o.stop(t+0.12);

      // мини-pad сразу, очень мягко
      const base=noteToFreq(0);
      const p1=ac.createOscillator(), p2=ac.createOscillator(), pg=ac.createGain();
      p1.type='sine'; p2.type='sine'; p1.frequency.value=base; p2.frequency.value=base*1.0015;
      pg.gain.value=0.0; p1.connect(pg); p2.connect(pg); pg.connect(master);
      pg.gain.setValueAtTime(0, t); pg.gain.linearRampToValueAtTime(0.04, t+0.9);
      p1.start(t); p2.start(t); p1.stop(t+1.4); p2.stop(t+1.4);

      setTimeout(initFullGraphAndClock,0);
    }

    function initFullGraphAndClock(){
      if(nodes._inited) return; nodes._inited=true;

      // Reverb с фильтрами
      nodes.rev=ac.createConvolver(); nodes.rev.buffer=makeImpulse();
      nodes.revHP=ac.createBiquadFilter(); nodes.revHP.type='highpass'; nodes.revHP.frequency.value=200;
      nodes.revLP=ac.createBiquadFilter(); nodes.revLP.type='lowpass';  nodes.revLP.frequency.value=5200;
      nodes.revSend=ac.createGain(); nodes.revSend.gain.value=.28;
      nodes.revSend.connect(nodes.revHP).connect(nodes.revLP).connect(nodes.rev).connect(master);

      // Delay с фильтрацией (нет «песка» и гула)
      nodes.delay=ac.createDelay(2.0);
      nodes.dHP=ac.createBiquadFilter(); nodes.dHP.type='highpass'; nodes.dHP.frequency.value=300;
      nodes.dLP=ac.createBiquadFilter(); nodes.dLP.type='lowpass';  nodes.dLP.frequency.value=2800; // ↓
      nodes.dWet=ac.createGain(); nodes.dWet.gain.value=.18;
      nodes.dFB=ac.createGain(); nodes.dFB.gain.value=.09;
      nodes.delay.delayTime.value=Math.max(.22,(60/tempoBpm)/3);
      nodes.delay.connect(nodes.dHP).connect(nodes.dLP).connect(nodes.dWet).connect(master);
      nodes.dLP.connect(nodes.dFB).connect(nodes.delay);

      // Pads — темнее и без гула
      nodes.padGain=ac.createGain(); nodes.padGain.gain.value=.070;
      nodes.padHP=ac.createBiquadFilter(); nodes.padHP.type='highpass'; nodes.padHP.frequency.value=200; nodes.padHP.Q.value=.9;  // ↑ чуть выше
      nodes.padLP=ac.createBiquadFilter(); nodes.padLP.type='lowpass'; nodes.padLP.frequency.value=1180; nodes.padLP.Q.value=.9;  // ↓ верх
      nodes.padGain.connect(nodes.padHP).connect(nodes.padLP);
      nodes.padBus=ac.createGain(); nodes.padBus.gain.value=1.0;
      nodes.padLP.connect(nodes.padBus).connect(master);
      const padSend=ac.createGain(); padSend.gain.value=.18; nodes.padLP.connect(padSend).connect(nodes.revSend);

      // Chorus — очень деликатный, чтобы не звенел
      nodes.chL=ac.createDelay(.023); nodes.chR=ac.createDelay(.028);
      nodes.chLG=ac.createGain(); nodes.chLG.gain.value=.09; nodes.chRG=ac.createGain(); nodes.chRG.gain.value=.09;
      const lfo1=ac.createOscillator(), lfo2=ac.createOscillator(); lfo1.frequency.value=.16; lfo2.frequency.value=.20;
      const d1=ac.createGain(); d1.gain.value=.0025; const d2=ac.createGain(); d2.gain.value=.0028;
      lfo1.connect(d1).connect(nodes.chL.delayTime); lfo2.connect(d2).connect(nodes.chR.delayTime);
      nodes.padLP.connect(nodes.chL).connect(nodes.chLG).connect(master);
      nodes.padLP.connect(nodes.chR).connect(nodes.chRG).connect(master);
      lfo1.start(); lfo2.start();

      // Rhythm — мягче и с HP
      nodes.rhythm=ac.createGain(); nodes.rhythm.gain.value=.095;
      nodes.rhythmHP=ac.createBiquadFilter(); nodes.rhythmHP.type='highpass'; nodes.rhythmHP.frequency.value=130; nodes.rhythmHP.Q.value=.707; // ↑ срез
      nodes.rhythm.connect(nodes.rhythmHP).connect(master);

      // Shimmer — темный и тихий
      nodes.shim=ac.createOscillator(); nodes.shim.type='sine'; nodes.shim.frequency.value=1180;
      nodes.shimG=ac.createGain(); nodes.shimG.gain.value=.0085;
      nodes.shimLP=ac.createBiquadFilter(); nodes.shimLP.type='lowpass'; nodes.shimLP.frequency.value=3000;
      nodes.shim.connect(nodes.shimLP).connect(nodes.shimG).connect(nodes.revSend); nodes.shim.start();

      // Zimmer bus (оставляем, но ещё темнее)
      nodes.braamBus=ac.createGain(); nodes.braamBus.gain.value=0.0;
      nodes.braamHP=ac.createBiquadFilter(); nodes.braamHP.type='highpass'; nodes.braamHP.frequency.value=140;
      nodes.braamLP=ac.createBiquadFilter(); nodes.braamLP.type='lowpass'; nodes.braamLP.frequency.value=1000;
      nodes.braamBus.connect(nodes.braamHP).connect(nodes.braamLP).connect(master);
      nodes.braamRevSend=ac.createGain(); nodes.braamRevSend.gain.value=.22; nodes.braamBus.connect(nodes.braamRevSend).connect(nodes.revSend);

      if(!intervalClock){ intervalClock=setInterval(scheduler,60); }
      updatePadChord(0); morphToStyle(curStyle,0);
    }

    // ===== scheduling with very smooth crossfades =====
    let prevPad=[];
    function updatePadChord(barIndex){
      const chord=prog[barIndex%prog.length], tones=chord.chord.map(noteToFreq), now=ac.currentTime;

      // Длинное мягкое перекрытие, без мгновенных стопов
      prevPad.forEach(v=>{
        try{
          v.gain.gain.cancelScheduledValues(now);
          v.gain.gain.setTargetAtTime(0.0001, now, 1.1);
          v.osc.stop(now+3.0);
        }catch(_){}
      });
      prevPad.length=0;

      tones.forEach(f=>{
        const o1=ac.createOscillator(); o1.type='sine'; o1.frequency.value=f;
        const o2=ac.createOscillator(); o2.type='sine'; o2.frequency.value=f*1.0015;
        const g=ac.createGain(); g.gain.value=0.0; o1.connect(g); o2.connect(g); g.connect(nodes.padGain);
        g.gain.setValueAtTime(0.0, now+0.02);
        g.gain.linearRampToValueAtTime(0.052, now+2.0); // ещё плавнее
        o1.start(now+0.02); o2.start(now+0.02);
        prevPad.push({osc:o1,gain:g},{osc:o2,gain:g});
      });

      nodes.padLP.frequency.cancelScheduledValues(now);
      nodes.padLP.frequency.setValueAtTime(nodes.padLP.frequency.value, now);
      nodes.padLP.frequency.setTargetAtTime(1120+Math.random()*120, now, 1.4);
    }

    function scheduleKick(t){
      const o=ac.createOscillator(); o.type='sine'; const g=ac.createGain();
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(.18,t+.020);
      g.gain.setTargetAtTime(0.0001,t+.09,0.40);
      o.frequency.setValueAtTime(85,t);
      o.frequency.exponentialRampToValueAtTime(62,t+.26);
      o.connect(g).connect(nodes.rhythm);
      if(nodes.padBus){
        nodes.padBus.gain.cancelScheduledValues(t);
        nodes.padBus.gain.setValueAtTime(nodes.padBus.gain.value,t);
        nodes.padBus.gain.setTargetAtTime(.96,t,0.11);
        nodes.padBus.gain.setTargetAtTime(1.0,t+.20,0.30);
      }
      pulseViz(t,0.8);
      o.start(t); o.stop(t+.5);
    }

    function scheduleMelody(t,f){
      const o=ac.createOscillator(); o.type='triangle';
      const vcf=ac.createBiquadFilter(); vcf.type='lowpass'; vcf.frequency.value=1500; vcf.Q.value=1.0; // ↓ верх
      const g=ac.createGain();
      const a=.024,d=.24;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(.18,t+a);
      g.gain.exponentialRampToValueAtTime(.075,t+a+d);
      g.gain.setTargetAtTime(0.0001,t+a+d,0.95);

      // мягкое открытие фильтра
      vcf.frequency.cancelScheduledValues(t);
      vcf.frequency.setValueAtTime(1100,t);
      vcf.frequency.linearRampToValueAtTime(1500,t+a+.14);
      vcf.frequency.setTargetAtTime(1400,t+a+.24,0.9);

      // вибрато в центах ≤ ±6
      const lfo=ac.createOscillator(); lfo.type='sine'; lfo.frequency.value=4.6; const lfoG=ac.createGain(); lfoG.gain.value=6; lfo.connect(lfoG).connect(o.detune);

      o.frequency.setValueAtTime(f,t); o.connect(vcf).connect(g);
      const dry=ac.createGain(); dry.gain.value=.56; g.connect(dry).connect(master);
      const sd=ac.createGain(); sd.gain.value=.32; g.connect(sd).connect(nodes.delay);
      const sr=ac.createGain(); sr.gain.value=.23; g.connect(sr).connect(nodes.rev);

      o.start(t); lfo.start(t);
      o.stop(t+3.2); lfo.stop(t+3.2);
    }

    function scheduleBraam(t){
      const base=110, freqs=[base, base*1.5, base*2], bus=nodes.braamBus, now=t;
      bus.gain.cancelScheduledValues(now);
      bus.gain.setValueAtTime(0.0001,now);
      bus.gain.linearRampToValueAtTime(0.14,now+1.3);
      bus.gain.setTargetAtTime(0.0001,now+2.8,1.3);
      freqs.forEach(f=>{
        const o=ac.createOscillator(); o.type='triangle';
        const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=900; // ещё темнее
        const g=ac.createGain(); g.gain.value=1.0;
        o.frequency.setValueAtTime(f,now);
        o.connect(lp).connect(g).connect(bus);
        o.start(now); o.stop(now+6.2);
      });
      nodes.braamRevSend.gain.cancelScheduledValues(now);
      nodes.braamRevSend.gain.setValueAtTime(0.0,now);
      nodes.braamRevSend.gain.linearRampToValueAtTime(0.40,now+1.3);
      nodes.braamRevSend.gain.setTargetAtTime(0.0,now+3.0,1.3);
    }

    function chooseMelodic(step){
      const bar=Math.floor(step/(subdiv*4)), chord=prog[bar%prog.length].chord;
      if(motif&&motif.queue.length){ const base=(step%4===0)?pick(chord):pick(scale); return {semi:base+motif.queue.shift(),swing:motif.swing}; }
      const oct=[-12,0,12][(Math.random()*3)|0]; return {semi: (step%4===0? pick(chord):pick(scale))+oct, swing:0};
    }
    function maybeSpawnMotif(){
      if(barsUntilMotif>0) return;
      const len=3+(Math.random()*3|0), start=pick([0,7]), steps=[-3,-2,0,2,3]; const q=[]; let cur=start;
      for(let i=0;i<len;i++){ cur=clamp(cur+steps[(Math.random()*steps.length)|0],-12,12); q.push(cur); }
      motif={queue:q,swing:0.04+Math.random()*0.05}; barsUntilMotif=8+(Math.random()*6|0);
    }

    function scheduler(){
      if(!ac) return; const now=ac.currentTime;
      while(nextNoteTime<now+0.5){
        const isBeat=(stepIndex%(subdiv*2)===0), barStart=(stepIndex%(subdiv*4)===0);
        if(isBeat) scheduleKick(nextNoteTime);
        if(curStyle==='zimmer' && barStart && (Math.floor(stepIndex/(subdiv*4))%16===0) && Math.random()<0.30){ scheduleBraam(nextNoteTime+0.05); }
        if(Math.random()<.80){ const m=chooseMelodic(stepIndex); const swing=(m.swing||0)*((Math.random()<.5)?1:-1); scheduleMelody(nextNoteTime + swing*stepDur, noteToFreq(m.semi)); }
        if(barStart){ updatePadChord(Math.floor(stepIndex/(subdiv*4))); barsUntilMotif--; if(!motif||motif.queue.length===0) maybeSpawnMotif(); }
        nextNoteTime+=stepDur; stepIndex++;
      }
    }

    function pulseViz(atTime,strength){
      const delay=Math.max(0,(atTime - (ac?.currentTime||0))*1000);
      setTimeout(()=>{ const prev=parseFloat(getComputedStyle(root).getPropertyValue('--pulse'))||0; const now=Math.min(1,prev*0.5+0.6*(strength||1));
        root.style.setProperty('--pulse',now.toFixed(3)); const start=performance.now();
        (function decay(t){const k=Math.max(0,1-(t-start)/300); root.style.setProperty('--pulse',(now*k).toFixed(3)); if(k>0) requestAnimationFrame(decay); else root.style.setProperty('--pulse','0');})(start);
      },delay);
    }

    // ===== Stay-awake =====
    let wakeLock=null, keepStream=null, keepCanvas=null, keepAnim=null;
    async function requestScreenWakeLock(){
      try{ if('wakeLock' in navigator){ wakeLock=await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',()=>{ if(playing) requestScreenWakeLock().catch(()=>{}); }); }
            else { await enableVideoKeepAwake(); } }
      catch(_){ await enableVideoKeepAwake(); }
    }
    async function enableVideoKeepAwake(){
      if(keepStream) return; const cv=document.createElement('canvas'); cv.width=2; cv.height=2; keepCanvas=cv; const kx=cv.getContext('2d'); let on=false;
      (function draw(){ if(!keepCanvas) return; on=!on; kx.fillStyle=on?'#111':'#000'; kx.fillRect(0,0,2,2); keepAnim=requestAnimationFrame(draw); })();
      keepStream=cv.captureStream(1); keepVid.srcObject=keepStream; keepVid.muted=true; keepVid.playsInline=true; keepVid.loop=true; try{ await keepVid.play(); }catch(_){}
    }
    function disableVideoKeepAwake(){
      try{ keepVid.pause(); }catch(_){}
      if(keepVid){ keepVid.srcObject=null; }
      if(keepStream){ keepStream.getTracks().forEach(t=>t.stop()); keepStream=null; }
      if(keepCanvas){ cancelAnimationFrame(keepAnim); keepAnim=null; keepCanvas=null; }
    }

    // ===== One-tap toggle =====
    function oneTapToggle(ev){
      ev.preventDefault?.();
      if(!ac){ createContextSync(); }
      try{ if(ac.state!=='running') ac.resume(); }catch(_){}
      try{ keep.volume=0.0001; keep.muted=false; if(keep.paused) keep.play(); }catch(_){}
      if(!playing){ requestScreenWakeLock().catch(()=>{}); } else { if(wakeLock){ wakeLock.release().catch(()=>{}); wakeLock=null; } disableVideoKeepAwake(); }

      playing=!playing;
      document.body.dataset.playing=playing?'1':'0';
      btn.setAttribute('data-playing', playing?'1':'0');
      btn.setAttribute('aria-label', playing?'Остановить музыку':'Включить музыку для фокусировки');
      const now=ac.currentTime, target=.70*Math.max(0,Math.min(1,+vol.value/100));
      master.gain.cancelScheduledValues(now);
      master.gain.setValueAtTime(master.gain.value, now);
      master.gain.setTargetAtTime(playing?target:0.0001, now, 0.9); // общий длинный фейд

      if(playing){
        nextNoteTime=ac.currentTime+.12; stepIndex=0; barsUntilMotif=6+(Math.random()*6|0); motif=null;
        if(!intervalClock){ intervalClock=setInterval(scheduler,60); }
        startCountdownIfNeeded(); hint.textContent='';
      }else{
        if(intervalClock){ clearInterval(intervalClock); intervalClock=null; }
        stopCountdown(); hint.textContent='';
      }
    }

    // ===== Timer =====
    let countdownId=null, countdownEndsAt=0;
    function startCountdownIfNeeded(){ stopCountdown(); const m=(+timer.value)|0; if(m>0){ countdownEndsAt=Date.now()+m*60*1000; renderCountdown(); countdownId=setInterval(renderCountdown,250);} else tmVal.textContent='ВЫКЛ'; }
    function stopCountdown(){ if(countdownId){ clearInterval(countdownId); countdownId=null; } }
    function renderCountdown(){ const ms=Math.max(0,countdownEndsAt-Date.now()); const s=Math.floor(ms/1000),mm=String(Math.floor(s/60)).padStart(2,'0'),ss=String(s%60).padStart(2,'0'); tmVal.textContent=mm+':'+ss; if(ms<=0){ stopCountdown(); const now=ac.currentTime; master.gain.cancelScheduledValues(now); master.gain.setValueAtTime(master.gain.value, now); master.gain.setTargetAtTime(0.0001, now, 1.0); setTimeout(()=>{ if(playing) oneTapToggle(new Event('synthetic')); },1100);} }

    // ===== Events =====
    btn.addEventListener('pointerdown', oneTapToggle, {passive:false});
    window.addEventListener('touchend', ()=>{ try{ keep.play(); }catch(_){ } }, {once:true, passive:true});
    vol.addEventListener('input', ()=>{ volVal.textContent=vol.value; if(ac){ const now=ac.currentTime; const target=.70*Math.max(0,Math.min(1,+vol.value/100)); master.gain.cancelScheduledValues(now); master.gain.setTargetAtTime(target, now, .3);} });
    tempoSlider.addEventListener('input', ()=>{ if(!ac) return; const v=+tempoSlider.value; tempoVal.textContent=v; tempoBpm=Math.max(60,Math.min(100,v|0)); beat=60/tempoBpm; stepDur=beat/subdiv; nodes?.delay?.delayTime.cancelScheduledValues(ac.currentTime); nodes?.delay?.delayTime.linearRampToValueAtTime(Math.max(.22,(60/tempoBpm)*(STYLE[curStyle].delTimeMul)), ac.currentTime+1.0); });

    stylesBox.addEventListener('click', e=>{ const b=e.target.closest('button[data-style]'); if(!b) return; stylesBox.querySelectorAll('.style-btn').forEach(el=>el.setAttribute('aria-pressed', String(el===b))); morphToStyle(b.dataset.style,28); });

    document.addEventListener('visibilitychange', ()=>{
      if(document.visibilityState==='visible'){
        if(ac && ac.state!=='running') ac.resume().catch(()=>{});
        if(playing) requestScreenWakeLock().catch(()=>{});
        try{ keep.play(); }catch(_){}
      }
    }, {passive:true});
    window.addEventListener('pageshow', ()=>{ if(ac && ac.state!=='running') ac.resume().catch(()=>{}); if(playing) requestScreenWakeLock().catch(()=>{}); try{ keep.play(); }catch(_){} }, {passive:true});

    // expose for debugging
    window.JF_DEBUG = { get ac(){return ac}, nodes, masterEQ1, masterHS, postHP, postLP };
  })();
  
  </script>
</body>
