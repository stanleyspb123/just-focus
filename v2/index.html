<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="theme-color" content="#09090a" />
  <title>JUST FOCUS</title>
  <style>
    :root{
      --bg:#09090a;
      --fg:#f5f5f7;
      --muted:rgba(245,245,247,.55);
      --line:rgba(245,245,247,.15);
      --panel:rgba(255,255,255,.055);
      --panel-border:rgba(255,255,255,.10);
    }

    *{box-sizing:border-box}
    html,body{height:100%}

    body{
      margin:0;
      background:
        radial-gradient(circle at 50% 44%, rgba(255,255,255,.035), transparent 32%),
        var(--bg);
      color:var(--fg);
      font:16px/1.4 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow:hidden;
    }

    .app{
      width:100%;
      height:100%;
      position:relative;
      display:grid;
      place-items:center;
      isolation:isolate;
    }

    .brand{
      position:fixed;
      top:28px;
      left:50%;
      transform:translateX(-50%);
      font-size:12px;
      font-weight:700;
      letter-spacing:.22em;
      color:rgba(245,245,247,.42);
      user-select:none;
      z-index:5;
    }

    canvas#waves{
      position:fixed;
      inset:0;
      width:100vw;
      height:100vh;
      pointer-events:none;
      z-index:0;
    }

    .play-wrap{
      position:relative;
      z-index:2;
      width:220px;
      height:220px;
      display:grid;
      place-items:center;
    }

    #play{
      width:108px;
      height:108px;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.15);
      background:rgba(255,255,255,.96);
      color:#09090a;
      display:grid;
      place-items:center;
      cursor:pointer;
      box-shadow:
        0 12px 42px rgba(0,0,0,.34),
        inset 0 0 0 1px rgba(255,255,255,.28);
      transition:transform .22s ease, box-shadow .22s ease, background .22s ease;
      -webkit-tap-highlight-color:transparent;
      outline:none;
    }

    #play:hover{ transform:scale(1.035); }
    #play:active{ transform:scale(.985); }

    #play[data-playing="1"]{
      background:#f5f5f7;
      box-shadow:
        0 0 0 12px rgba(255,255,255,.025),
        0 0 80px rgba(255,255,255,.10),
        0 12px 42px rgba(0,0,0,.34);
    }

    .icon{
      width:30px;
      height:30px;
      position:relative;
      display:block;
    }

    .icon::before,
    .icon::after{
      content:"";
      position:absolute;
      inset:0;
      margin:auto;
      transition:all .2s ease;
    }

    #play[data-playing="0"] .icon::before{
      width:0;
      height:0;
      border-top:15px solid transparent;
      border-bottom:15px solid transparent;
      border-left:22px solid #09090a;
      transform:translateX(3px);
    }

    #play[data-playing="0"] .icon::after{ display:none; }

    #play[data-playing="1"] .icon::before,
    #play[data-playing="1"] .icon::after{
      width:7px;
      height:28px;
      background:#09090a;
      border-radius:2px;
      top:1px;
      bottom:auto;
    }

    #play[data-playing="1"] .icon::before{ left:5px; right:auto; }
    #play[data-playing="1"] .icon::after{ right:5px; left:auto; }

    .status{
      position:absolute;
      top:calc(50% + 82px);
      left:50%;
      transform:translateX(-50%);
      font-size:12px;
      letter-spacing:.08em;
      color:var(--muted);
      user-select:none;
      white-space:nowrap;
    }

    .panel{
      position:fixed;
      left:50%;
      bottom:26px;
      transform:translateX(-50%);
      z-index:5;
      width:min(1180px, calc(100vw - 32px));
      padding:16px 18px;
      border:1px solid var(--panel-border);
      border-radius:26px;
      background:var(--panel);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      box-shadow:0 10px 40px rgba(0,0,0,.16);
      display:grid;
      grid-template-columns:1fr 1fr 1.5fr;
      gap:18px;
      align-items:center;
    }

    .control{
      display:grid;
      grid-template-columns:auto 1fr auto;
      gap:12px;
      align-items:center;
      min-width:0;
    }

    .control-title{
      font-size:13px;
      font-weight:650;
      color:rgba(245,245,247,.78);
      white-space:nowrap;
    }

    .value{
      font-variant-numeric:tabular-nums;
      font-size:14px;
      color:rgba(245,245,247,.92);
      min-width:58px;
      text-align:right;
      white-space:nowrap;
    }

    input[type="range"]{
      appearance:none;
      width:100%;
      height:26px;
      background:transparent;
      cursor:pointer;
      outline:none;
    }

    input[type="range"]::-webkit-slider-runnable-track{
      height:4px;
      background:rgba(255,255,255,.26);
      border-radius:999px;
    }

    input[type="range"]::-webkit-slider-thumb{
      appearance:none;
      width:17px;
      height:17px;
      margin-top:-6.5px;
      border-radius:50%;
      background:#f5f5f7;
      box-shadow:0 0 0 5px rgba(255,255,255,.12);
    }

    input[type="range"]::-moz-range-track{
      height:4px;
      background:rgba(255,255,255,.26);
      border-radius:999px;
    }

    input[type="range"]::-moz-range-thumb{
      width:17px;
      height:17px;
      border:none;
      border-radius:50%;
      background:#f5f5f7;
      box-shadow:0 0 0 5px rgba(255,255,255,.12);
    }

    .styles{
      display:flex;
      justify-content:flex-end;
      gap:8px;
      flex-wrap:wrap;
    }

    .style-btn{
      appearance:none;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.05);
      color:rgba(245,245,247,.76);
      border-radius:999px;
      padding:10px 15px;
      font-weight:650;
      font-size:13px;
      cursor:pointer;
      transition:background .18s ease, color .18s ease, transform .18s ease;
    }

    .style-btn:hover{ transform:translateY(-1px); }
    .style-btn[aria-pressed="true"]{
      background:#f5f5f7;
      color:#09090a;
      border-color:#f5f5f7;
    }

    .mobile-label{
      display:none;
      font-size:12px;
      color:var(--muted);
      margin-bottom:4px;
    }

    @media (max-width: 820px){
      .brand{top:20px}
      .panel{
        bottom:14px;
        padding:14px;
        border-radius:22px;
        grid-template-columns:1fr;
        gap:10px;
      }
      .control{grid-template-columns:78px 1fr 54px; gap:10px}
      .styles{justify-content:flex-start}
      .mobile-label{display:block}
      .play-wrap{transform:translateY(-46px)}
      .status{top:calc(50% + 36px)}
    }

    @media (max-height: 640px){
      .play-wrap{transform:scale(.86) translateY(-40px)}
      .panel{bottom:10px}
    }

    @media (prefers-reduced-motion: reduce){
      #play,.style-btn{transition:none}
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="brand">JUST FOCUS</div>
    <canvas id="waves"></canvas>

    <div class="play-wrap">
      <button id="play" data-playing="0" aria-label="Включить музыку для фокусировки">
        <span class="icon" aria-hidden="true"></span>
      </button>
      <div class="status" id="status">READY</div>
    </div>

    <section class="panel" aria-label="Настройки звука">
      <div class="control">
        <span class="control-title">Громкость</span>
        <input id="vol" type="range" min="0" max="100" value="39" />
        <span class="value" id="volValue">39</span>
      </div>

      <div class="control">
        <span class="control-title">Темп</span>
        <input id="bpm" type="range" min="54" max="108" step="1" value="76" />
        <span class="value"><span id="bpmValue">76</span> BPM</span>
      </div>

      <div>
        <div class="mobile-label">Стиль</div>
        <div class="styles" role="group" aria-label="Стиль звучания">
          <button class="style-btn" data-style="calm" aria-pressed="true">Calm</button>
          <button class="style-btn" data-style="warm" aria-pressed="false">Warm</button>
          <button class="style-btn" data-style="space" aria-pressed="false">Space</button>
          <button class="style-btn" data-style="zimmer" aria-pressed="false">Zimmer</button>
        </div>
      </div>
    </section>
  </main>

  <script>
  ;(() => {
    const canvas = document.getElementById('waves');
    const g = canvas.getContext('2d');
    const playBtn = document.getElementById('play');
    const volEl = document.getElementById('vol');
    const bpmEl = document.getElementById('bpm');
    const volValue = document.getElementById('volValue');
    const bpmValue = document.getElementById('bpmValue');
    const statusEl = document.getElementById('status');
    const styleButtons = [...document.querySelectorAll('.style-btn')];

    let DPR = 1, W = 0, H = 0;
    let isPlaying = false;
    let energy = 0;
    let phase = 0;
    let last = performance.now();

    function resize(){
      DPR = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
      W = canvas.width = Math.floor(innerWidth * DPR);
      H = canvas.height = Math.floor(innerHeight * DPR);
      canvas.style.width = innerWidth + 'px';
      canvas.style.height = innerHeight + 'px';
    }
    addEventListener('resize', resize, {passive:true});
    resize();

    function draw(now){
      const dt = Math.min(40, now-last);
      last = now;
      const bpm = +bpmEl.value || 76;
      phase += dt * (bpm/76) * 0.0027;

      const target = isPlaying ? 1 : 0;
      energy += (target - energy) * (isPlaying ? .055 : .035);

      g.clearRect(0,0,W,H);

      if(energy > .005){
        const cx = W/2, cy = H/2;
        const base = Math.min(W,H) * .10;
        const rings = innerWidth < 700 ? 4 : 6;

        for(let i=0;i<rings;i++){
          const p = phase + i * .55;
          const breathe = (Math.sin(p * 2.1) + 1) / 2;
          const pulse = Math.pow(Math.max(0, Math.sin(p * Math.PI)), 2.5);
          const r = base + i * (Math.min(W,H)*.035) + breathe*(18*DPR) + pulse*(20*DPR);

          g.beginPath();
          g.arc(cx, cy, r, 0, Math.PI*2);
          g.strokeStyle = `rgba(245,245,247,${(0.11 - i*0.012) * energy})`;
          g.lineWidth = (1.15 + pulse*.8) * DPR;
          g.stroke();
        }

        const glow = g.createRadialGradient(cx,cy,base*.45,cx,cy,base*2.9);
        glow.addColorStop(0, `rgba(255,255,255,${.035*energy})`);
        glow.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = glow;
        g.fillRect(0,0,W,H);
      }

      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);

    // ---------- AUDIO ----------
    let ctx, master, timer = null;
    const n = {};
    let tNext = 0, step = 0;

    const state = {
      bpm:76,
      subdiv:2,
      stepDur:0,
      melodyChance:.62,
      currentStyle:'calm'
    };

    const presets = {
      calm:   { melodyChance:.52, padLP:1250, kickLvl:.07, padLvl:.050, bgLvl:.014, delayMix:.14, revMix:.26 },
      warm:   { melodyChance:.68, padLP:1650, kickLvl:.08, padLvl:.062, bgLvl:.016, delayMix:.18, revMix:.30 },
      space:  { melodyChance:.56, padLP:1950, kickLvl:.055,padLvl:.050, bgLvl:.020, delayMix:.34, revMix:.42 },
      zimmer: { melodyChance:.82, padLP:2200, kickLvl:.13, padLvl:.070, bgLvl:.012, delayMix:.20, revMix:.34 }
    };

    const rootA = 220;
    const pent = [0,3,5,7,10,12];
    const prog = [[0,7,12],[-8,0,5],[-12,-5,0],[-2,5,10]];

    function setBPM(bpm){
      state.bpm = bpm;
      const beat = 60 / bpm;
      state.stepDur = beat / state.subdiv;
      if(n.delay) n.delay.delayTime.value = Math.max(.05, beat*.7);
    }

    function applyPreset(name){
      state.currentStyle = name;
      const p = presets[name] || presets.calm;
      state.melodyChance = p.melodyChance;

      if(!ctx) return;
      const t = ctx.currentTime;
      if(n.padLP) n.padLP.frequency.linearRampToValueAtTime(p.padLP, t+.35);
      if(n.rh) n.rh.gain.linearRampToValueAtTime(p.kickLvl, t+.25);
      if(n.padG) n.padG.gain.linearRampToValueAtTime(p.padLvl, t+.4);
      if(n.bg) n.bg.gain.linearRampToValueAtTime(p.bgLvl, t+.4);
      if(n.dOut) n.dOut.gain.linearRampToValueAtTime(p.delayMix, t+.3);
      if(n.rOut) n.rOut.gain.linearRampToValueAtTime(p.revMix, t+.3);
    }

    function ctxInit(){
      if(ctx) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC({latencyHint:'interactive'});

      master = ctx.createGain();
      master.gain.value = .0001;

      n.comp = ctx.createDynamicsCompressor();
      n.comp.threshold.value = -18;
      n.comp.knee.value = 24;
      n.comp.ratio.value = 2.4;
      n.comp.attack.value = .01;
      n.comp.release.value = .18;

      n.rev = ctx.createConvolver();
      n.rev.buffer = imp(1.8,.5);
      n.rOut = ctx.createGain();
      n.rOut.gain.value = .26;
      n.rev.connect(n.rOut);
      n.rOut.connect(master);

      n.delay = ctx.createDelay(2);
      n.fb = ctx.createGain();
      n.fb.gain.value = .12;
      n.delay.connect(n.fb).connect(n.delay);
      n.dOut = ctx.createGain();
      n.dOut.gain.value = .14;
      n.delay.connect(n.dOut);
      n.dOut.connect(master);

      const base = 220, diff = 6;
      n.bl = ctx.createOscillator();
      n.br = ctx.createOscillator();
      n.bl.type = n.br.type = 'sine';
      n.bl.frequency.value = base-diff/2;
      n.br.frequency.value = base+diff/2;

      const hasSP = 'StereoPannerNode' in window;
      n.pl = hasSP ? new StereoPannerNode(ctx,{pan:-1}) : ctx.createGain();
      n.pr = hasSP ? new StereoPannerNode(ctx,{pan: 1}) : ctx.createGain();
      n.bg = ctx.createGain();
      n.bg.gain.value = .014;

      n.bl.connect(n.pl);
      n.br.connect(n.pr);
      n.pl.connect(n.bg);
      n.pr.connect(n.bg);
      n.bg.connect(master);

      n.padG = ctx.createGain();
      n.padG.gain.value = .05;
      n.padLP = ctx.createBiquadFilter();
      n.padLP.type = 'lowpass';
      n.padLP.frequency.value = 1250;
      n.padLP.Q.value = .7;
      n.padG.connect(n.padLP);

      const pSend = ctx.createGain();
      pSend.gain.value = .14;
      n.padLP.connect(pSend);
      pSend.connect(n.rev);

      n.padBus = ctx.createGain();
      n.padBus.gain.value = 1;
      n.padLP.connect(n.padBus);
      n.padBus.connect(master);

      n.rh = ctx.createGain();
      n.rh.gain.value = .07;
      n.rh.connect(master);

      n.bl.start();
      n.br.start();
      updPad(0);

      // Final output chain. All sources/effects feed master, then compressor, then speakers.
      master.disconnect();
      n.comp.disconnect();
      master.connect(n.comp);
      n.comp.connect(ctx.destination);

      setBPM(+bpmEl.value || 76);
      applyPreset(state.currentStyle);
    }

    function fSemi(s){ return rootA * Math.pow(2,s/12); }

    function mel(time,f){
      const o = ctx.createOscillator();
      o.type = state.currentStyle === 'space' ? 'sine' : 'triangle';

      const v = ctx.createBiquadFilter();
      v.type = 'lowpass';
      v.frequency.value = state.currentStyle === 'zimmer' ? 2600 : 2200;
      v.Q.value = .9;

      const gain = ctx.createGain();
      const a=.01,d=.12,r=.65;
      gain.gain.setValueAtTime(.0001,time);
      gain.gain.exponentialRampToValueAtTime(.20,time+a);
      gain.gain.exponentialRampToValueAtTime(.06,time+a+d);
      gain.gain.exponentialRampToValueAtTime(.0001,time+a+d+r);

      o.frequency.setValueAtTime(f,time);
      o.connect(v);
      v.connect(gain);

      const dry = ctx.createGain();
      dry.gain.value = state.currentStyle === 'space' ? .42 : .56;
      gain.connect(dry);
      dry.connect(master);

      const sd = ctx.createGain();
      sd.gain.value = state.currentStyle === 'space' ? .52 : .34;
      gain.connect(sd);
      sd.connect(n.delay);

      const sr = ctx.createGain();
      sr.gain.value = state.currentStyle === 'warm' ? .24 : .18;
      gain.connect(sr);
      sr.connect(n.rev);

      o.start(time);
      o.stop(time+2);
    }

    function updPad(bar){
      if(!ctx) return;
      const chord = prog[bar%prog.length].map(fSemi);
      if(n.pads) n.pads.forEach(v=>{ try{v.osc.stop()}catch(e){} });
      n.pads = [];

      chord.forEach(f=>{
        const o1 = ctx.createOscillator();
        const o2 = ctx.createOscillator();
        o1.type = o2.type = 'sine';
        o1.frequency.value = f;
        o2.frequency.value = f*1.004;

        const gain = ctx.createGain();
        gain.gain.value = 0;
        o1.connect(gain);
        o2.connect(gain);
        gain.connect(n.padG);

        const now = ctx.currentTime;
        gain.gain.linearRampToValueAtTime(0,now);
        gain.gain.linearRampToValueAtTime(.042,now+1.0);

        o1.start();
        o2.start();
        n.pads.push({osc:o1,gain},{osc:o2,gain});
      });
    }

    function kick(time){
      const o = ctx.createOscillator();
      const gain = ctx.createGain();
      o.type='sine';

      gain.gain.setValueAtTime(.0001,time);
      gain.gain.exponentialRampToValueAtTime(state.currentStyle==='zimmer' ? .48 : .34,time+.005);
      gain.gain.exponentialRampToValueAtTime(.0001,time+.18);

      o.frequency.setValueAtTime(state.currentStyle==='zimmer' ? 100 : 86,time);
      o.frequency.exponentialRampToValueAtTime(52,time+.18);
      o.connect(gain);
      gain.connect(n.rh);

      o.start(time);
      o.stop(time+.22);
    }

    function hat(time){
      const src = ctx.createBufferSource();
      src.buffer = noise(.07);

      const hp = ctx.createBiquadFilter();
      hp.type='highpass';
      hp.frequency.value=4200;

      const lp = ctx.createBiquadFilter();
      lp.type='lowpass';
      lp.frequency.value=8500;

      const gain = ctx.createGain();
      gain.gain.setValueAtTime(.0001,time);
      gain.gain.exponentialRampToValueAtTime(.08,time+.005);
      gain.gain.exponentialRampToValueAtTime(.0001,time+.07);

      src.connect(hp);
      hp.connect(lp);
      lp.connect(gain);
      gain.connect(n.rh);
      src.start(time);
      src.stop(time+.08);
    }

    function noise(sec){
      const len = Math.floor((ctx?.sampleRate||48000)*sec);
      const b = ctx.createBuffer(1,len,ctx.sampleRate||48000);
      const d = b.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*.5;
      return b;
    }

    function imp(sec=1.8,dec=.5){
      const r = ctx.sampleRate||48000;
      const len = Math.floor(sec*r);
      const b = ctx.createBuffer(2,len,r);

      for(let ch=0; ch<2; ch++){
        const d=b.getChannelData(ch);
        for(let i=0;i<len;i++){
          d[i]=(Math.random()*2-1)*Math.pow(1-i/len,dec*4);
        }
      }
      return b;
    }

    function pick(a){ return a[(Math.random()*a.length)|0]; }

    function choose(step){
      const bar = Math.floor(step/(state.subdiv*4));
      const chord = prog[bar%prog.length];
      const oct = pick([-12,0,12]);
      const strong = step%4===0;
      return fSemi((strong?pick(chord):pick(pent))+oct);
    }

    function sched(){
      if(!ctx || !isPlaying) return;
      const now=ctx.currentTime;

      while(tNext < now+.5){
        if(Math.random() < state.melodyChance) mel(tNext,choose(step));

        const beat = step%(state.subdiv*2)===0;
        const off  = step%(state.subdiv*2)===state.subdiv;

        if(beat) kick(tNext);
        if(off && state.currentStyle !== 'calm') hat(tNext);
        if(step%(state.subdiv*4)===0) updPad(Math.floor(step/(state.subdiv*4)));

        tNext += state.stepDur;
        step++;
      }
    }

    async function start(){
      ctxInit();
      if(ctx.state !== 'running') await ctx.resume();

      isPlaying = true;
      playBtn.dataset.playing = '1';
      playBtn.setAttribute('aria-label','Остановить музыку');
      statusEl.textContent = 'FOCUSING';

      const now = ctx.currentTime;
      master.gain.cancelScheduledValues(now);
      master.gain.setValueAtTime(Math.max(.0001,master.gain.value));
      master.gain.exponentialRampToValueAtTime(Math.max(.02,+volEl.value/100),now+1.0);

      tNext = ctx.currentTime+.05;
      step=0;
      if(!timer) timer=setInterval(sched,100);
    }

    function stop(){
      if(!ctx) return;
      isPlaying = false;
      playBtn.dataset.playing='0';
      playBtn.setAttribute('aria-label','Включить музыку для фокусировки');
      statusEl.textContent='READY';

      const now=ctx.currentTime;
      master.gain.cancelScheduledValues(now);
      master.gain.setValueAtTime(Math.max(.0001,master.gain.value));
      master.gain.exponentialRampToValueAtTime(.0001,now+.65);

      if(timer){
        clearInterval(timer);
        timer=null;
      }
    }

    async function toggle(){
      if(isPlaying) stop();
      else await start();
    }

    playBtn.addEventListener('click',toggle);

    volEl.addEventListener('input',()=>{
      volValue.textContent=volEl.value;
      if(ctx && isPlaying){
        const now=ctx.currentTime;
        master.gain.cancelScheduledValues(now);
        master.gain.linearRampToValueAtTime(Math.max(.02,+volEl.value/100),now+.12);
      }
    });

    bpmEl.addEventListener('input',()=>{
      bpmValue.textContent=bpmEl.value;
      setBPM(+bpmEl.value);
    });

    styleButtons.forEach(btn=>{
      btn.addEventListener('click',()=>{
        const style=btn.dataset.style;
        styleButtons.forEach(b=>b.setAttribute('aria-pressed',String(b===btn)));
        applyPreset(style);
      });
    });

    document.addEventListener('keydown',e=>{
      if(e.code==='Space'){
        e.preventDefault();
        toggle();
      }
      if(e.key==='Escape' && isPlaying) stop();
    });
  })();
  </script>
</body>
</html>
