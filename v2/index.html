<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#08090b" />
  <title>JUST FOCUS 2.4</title>
  <style>
    :root{
      --bg:#08090b;
      --fg:#f7f7f5;
      --muted:rgba(247,247,245,.55);
      --line:rgba(255,255,255,.10);
      --panel:rgba(255,255,255,.045);
      --panel2:rgba(255,255,255,.075);
      --accent:#f7f7f5;
      --glow:255,255,255;
      --safe-bottom:max(18px, env(safe-area-inset-bottom));
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      background:
        radial-gradient(circle at 50% 46%, rgba(var(--glow),.05), transparent 36%),
        var(--bg);
      color:var(--fg);
      font:15px/1.35 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow:hidden;
    }
    button,input{font:inherit}
    button{-webkit-tap-highlight-color:transparent}
    .app{height:100%;position:relative;isolation:isolate}
    canvas#waves{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
    .topbar{
      position:fixed;left:0;right:0;top:0;z-index:10;
      padding:22px 26px;
      display:flex;align-items:center;justify-content:space-between;
    }
    .brand{
      font-size:11px;font-weight:800;letter-spacing:.22em;
      color:rgba(247,247,245,.48);user-select:none;
    }
    .version{
      font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:rgba(247,247,245,.30)
    }
    .screen{
      position:absolute;inset:0;z-index:2;
      display:flex;align-items:center;justify-content:center;
      padding:78px 24px 118px;
      transition:opacity .28s ease, transform .28s ease;
    }
    .screen.hidden{opacity:0;pointer-events:none;transform:translateY(8px)}
    .home{
      width:min(960px,100%);
      max-height:100%;
      overflow:auto;
      scrollbar-width:none;
      padding-bottom:16px;
    }
    .home::-webkit-scrollbar{display:none}
    .eyebrow{
      color:var(--muted);
      font-size:12px;text-transform:uppercase;letter-spacing:.14em;
      margin-bottom:14px;
    }
    h1{
      font-size:clamp(32px,5vw,64px);
      line-height:.98;letter-spacing:-.045em;
      margin:0 0 16px;font-weight:650;
    }
    .lead{
      max-width:620px;color:rgba(247,247,245,.58);
      font-size:clamp(15px,2vw,18px);
      margin-bottom:32px;
    }
    .grid{
      display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;
    }
    .mode-card{
      appearance:none;text-align:left;color:var(--fg);
      border:1px solid var(--line);background:var(--panel);
      border-radius:22px;padding:18px;min-height:145px;
      cursor:pointer;transition:.18s ease;
      display:flex;flex-direction:column;justify-content:space-between;
    }
    .mode-card:hover{transform:translateY(-2px);background:var(--panel2);border-color:rgba(255,255,255,.18)}
    .mode-icon{font-size:25px;filter:grayscale(1);opacity:.88}
    .mode-name{font-size:16px;font-weight:650;letter-spacing:-.02em;margin-top:12px}
    .mode-desc{font-size:12px;color:var(--muted);margin-top:5px}
    .player{
      width:min(760px,100%);text-align:center;
      display:flex;flex-direction:column;align-items:center;
    }
    .back{
      position:absolute;left:26px;top:74px;
      appearance:none;border:0;background:transparent;color:rgba(247,247,245,.48);
      cursor:pointer;padding:8px 0;font-size:13px;
    }
    .back:hover{color:var(--fg)}
    .state-label{
      font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:rgba(247,247,245,.42);
      margin-bottom:12px;
    }
    .state-title{
      font-size:clamp(30px,5vw,58px);line-height:1;letter-spacing:-.045em;
      font-weight:650;margin:0 0 10px;
    }
    .state-copy{color:var(--muted);max-width:480px;min-height:42px}
    .orb-wrap{
      width:300px;height:300px;display:grid;place-items:center;
      margin:8px 0 0;position:relative;
    }
    .orb-ring{
      position:absolute;width:210px;height:210px;border:1px solid rgba(255,255,255,.08);
      border-radius:50%;transition:transform .8s ease,opacity .6s ease;
    }
    .play{
      width:116px;height:116px;border-radius:50%;
      border:1px solid rgba(255,255,255,.18);
      background:#f7f7f5;color:#08090b;cursor:pointer;
      box-shadow:0 18px 60px rgba(0,0,0,.30),0 0 60px rgba(var(--glow),.06);
      display:grid;place-items:center;position:relative;z-index:3;
      transition:.22s ease;
    }
    .play:hover{transform:scale(1.035)}
    .play:active{transform:scale(.985)}
    .playIcon{width:32px;height:32px;position:relative}
    .play[data-playing="0"] .playIcon:before{
      content:"";position:absolute;left:8px;top:2px;
      width:0;height:0;border-top:14px solid transparent;border-bottom:14px solid transparent;border-left:21px solid #08090b;
    }
    .play[data-playing="1"] .playIcon:before,
    .play[data-playing="1"] .playIcon:after{
      content:"";position:absolute;top:3px;width:7px;height:27px;border-radius:2px;background:#08090b;
    }
    .play[data-playing="1"] .playIcon:before{left:6px}
    .play[data-playing="1"] .playIcon:after{right:6px}
    .now{
      margin-top:-12px;min-height:22px;color:rgba(247,247,245,.42);font-size:12px
    }
    .controls{
      width:min(620px,100%);
      display:grid;grid-template-columns:1fr auto;gap:18px;
      align-items:center;margin-top:24px;padding-top:20px;border-top:1px solid var(--line);
    }
    .sliderBox{text-align:left}
    .sliderHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
    .sliderTitle{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:rgba(247,247,245,.5)}
    .sliderValue{font-size:12px;color:rgba(247,247,245,.72);font-variant-numeric:tabular-nums}
    input[type="range"]{
      appearance:none;width:100%;height:28px;background:transparent;cursor:pointer;
    }
    input[type="range"]::-webkit-slider-runnable-track{height:2px;background:rgba(255,255,255,.22);border-radius:999px}
    input[type="range"]::-webkit-slider-thumb{
      appearance:none;width:16px;height:16px;border-radius:50%;background:#f7f7f5;margin-top:-7px;
      box-shadow:0 0 0 4px rgba(255,255,255,.07)
    }
    .quietBtn{
      appearance:none;border:1px solid var(--line);background:transparent;color:rgba(247,247,245,.65);
      border-radius:999px;padding:11px 15px;cursor:pointer;white-space:nowrap;
    }
    .quietBtn:hover{background:var(--panel2);color:var(--fg)}
    .bottomNote{
      position:fixed;bottom:var(--safe-bottom);left:50%;transform:translateX(-50%);
      z-index:10;color:rgba(247,247,245,.27);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
      white-space:nowrap;
    }
    @media(max-width:760px){
      body{overflow:auto}
      .screen{padding:72px 16px 100px;align-items:flex-start}
      .home{padding-top:18px}
      .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .mode-card{min-height:132px;padding:16px}
      .player{padding-top:42px}
      .back{top:66px;left:18px}
      .orb-wrap{width:250px;height:250px}
      .controls{grid-template-columns:1fr;gap:8px;margin-top:10px}
      .quietBtn{justify-self:center}
      .topbar{padding:19px 18px}
      .bottomNote{font-size:9px}
    }
    @media(max-height:700px) and (min-width:761px){
      .screen{padding-top:60px;padding-bottom:70px}
      .orb-wrap{width:235px;height:235px}
      .play{width:96px;height:96px}
      .state-title{font-size:42px}
      .controls{margin-top:4px;padding-top:14px}
    }
    @media(prefers-reduced-motion:reduce){
      *{scroll-behavior:auto!important;transition:none!important}
    }
  </style>
</head>
<body>
<div class="app">
  <canvas id="waves"></canvas>
  <header class="topbar">
    <div class="brand">JUST FOCUS</div>
    <div class="version">experimental v2.4</div>
  </header>

  <section class="screen" id="homeScreen">
    <div class="home">
      <div class="eyebrow">Adaptive stimulation</div>
      <h1>Что происходит<br>прямо сейчас?</h1>
      <div class="lead">Выбери состояние, а не жанр. JUST FOCUS подберёт уровень звуковой стимуляции под задачу.</div>
      <div class="grid" id="modeGrid"></div>
    </div>
  </section>

  <section class="screen hidden" id="playerScreen">
    <button class="back" id="backBtn">← все режимы</button>
    <div class="player">
      <div class="state-label" id="stateLabel">Режим</div>
      <h2 class="state-title" id="stateTitle">Deep work</h2>
      <div class="state-copy" id="stateCopy"></div>

      <div class="orb-wrap">
        <div class="orb-ring" id="orbRing"></div>
        <button class="play" id="playBtn" data-playing="0" aria-label="Запустить звук">
          <span class="playIcon"></span>
        </button>
      </div>
      <div class="now" id="nowLabel">готово к запуску</div>

      <div class="controls">
        <div class="sliderBox">
          <div class="sliderHead">
            <span class="sliderTitle">Стимуляция</span>
            <span class="sliderValue" id="stimValue">30</span>
          </div>
          <input id="stim" type="range" min="0" max="100" step="1" value="30" />
        </div>
        <button class="quietBtn" id="lessBtn">Слишком много</button>
      </div>
    </div>
  </section>

  <div class="bottomNote">prototype · not a medical treatment</div>
</div>

<script>
(() => {
  const MODES = {
    routine: {
      icon:'◒', name:'Домашняя рутина', short:'Начать и не бросить',
      title:'Momentum', copy:'Больше ритма и предсказуемого движения. Для уборки, готовки и других скучных дел.',
      stim:72, kind:'rhythm', bpm:116, noise:'pink'
    },
    drive: {
      icon:'◇', name:'За рулём', short:'Бодрость без перегруза',
      title:'Drive', copy:'Умеренная стимуляция, минимум неожиданностей. Интерфейс не требует внимания во время движения.',
      stim:48, kind:'rhythm', bpm:96, noise:'pink'
    },
    work: {
      icon:'▦', name:'Работа', short:'Глубокий фокус',
      title:'Deep work', copy:'Тёплая гармония и редкая мелодия без речи. Для текста, анализа и сложных задач.',
      stim:30, kind:'focus', bpm:72, noise:'pink'
    },
    sport: {
      icon:'▲', name:'Активный спорт', short:'Энергия и темп',
      title:'Power', copy:'Высокая стимуляция и выраженный пульс для тренировки, бега и активного движения.',
      stim:90, kind:'rhythm', bpm:144, noise:'white'
    },
    meditate: {
      icon:'○', name:'Медитация', short:'Один объект внимания',
      title:'Breathe', copy:'Очень простой звуковой поток и медленная волна дыхания: около шести циклов в минуту.',
      stim:18, kind:'breathe', bpm:36, noise:'pink'
    },
    sleep: {
      icon:'◐', name:'Подготовка ко сну', short:'Постепенно тише',
      title:'Sleep down', copy:'Мягкий низкосложный фон. Чем ниже стимуляция — тем меньше ритма и тем ближе звук к тишине.',
      stim:14, kind:'sleep', bpm:66, noise:'pink'
    },
    stress: {
      icon:'≈', name:'Стресс', short:'Снизить возбуждение',
      title:'Calm', copy:'Ровный, мягкий фон с медленными изменениями. Без голосов и резких звуковых событий.',
      stim:20, kind:'calm', bpm:60, noise:'pink'
    },
    overload: {
      icon:'·', name:'Перегрузка', short:'Убрать стимулы',
      title:'Quiet', copy:'Здесь звук — не цель. По умолчанию почти тишина; можно оставить только очень мягкий музыкальный фон.',
      stim:5, kind:'quiet', bpm:54, noise:'pink'
    }
  };

  const home = document.getElementById('homeScreen');
  const player = document.getElementById('playerScreen');
  const grid = document.getElementById('modeGrid');
  const title = document.getElementById('stateTitle');
  const copy = document.getElementById('stateCopy');
  const label = document.getElementById('stateLabel');
  const stim = document.getElementById('stim');
  const stimValue = document.getElementById('stimValue');
  const playBtn = document.getElementById('playBtn');
  const nowLabel = document.getElementById('nowLabel');
  const backBtn = document.getElementById('backBtn');
  const lessBtn = document.getElementById('lessBtn');
  const orbRing = document.getElementById('orbRing');

  let currentKey = 'work';
  let playing = false;

  Object.entries(MODES).forEach(([key,m])=>{
    const b=document.createElement('button');
    b.className='mode-card';
    b.innerHTML=`<div class="mode-icon">${m.icon}</div><div><div class="mode-name">${m.name}</div><div class="mode-desc">${m.short}</div></div>`;
    b.onclick=()=>openMode(key);
    grid.appendChild(b);
  });

  function openMode(key){
    currentKey=key;
    const m=MODES[key];
    title.textContent=m.title;
    copy.textContent=m.copy;
    label.textContent=m.name;
    stim.value=m.stim;
    updateStim();
    home.classList.add('hidden');
    player.classList.remove('hidden');
    if(playing) applyProfile();
  }
  function closeMode(){
    if(playing) stopAudio();
    player.classList.add('hidden');
    home.classList.remove('hidden');
  }
  backBtn.onclick=closeMode;

  function stimText(v){
    if(v<=8) return `${v} · почти тишина`;
    if(v<25) return `${v} · низкая`;
    if(v<55) return `${v} · умеренная`;
    if(v<80) return `${v} · высокая`;
    return `${v} · максимальная`;
  }
  function updateStim(){
    const v=+stim.value;
    stimValue.textContent=stimText(v);
    orbRing.style.transform=`scale(${0.92+v/500})`;
    orbRing.style.opacity=(.22+v/150).toFixed(2);
    if(playing) applyProfile(false);
  }
  stim.oninput=updateStim;
  lessBtn.onclick=()=>{
    stim.value=Math.max(0,+stim.value-15);
    updateStim();
  };

  // ----- JUST FOCUS 2.4: 100% generative music; no audio files; no noise -----
  let ac=null,master=null,dry=null,wet=null,reverb=null,timers=[],generation=0;
  const MUSIC={
    routine:{bpm:104,root:48,chords:[[0,4,7,11],[9,12,16,19],[5,9,12,16],[7,11,14,17]],melody:[12,14,16,null,19,16,14,null,12,14,16,14,12,null,9,null],cb:8,bass:1,pulse:1},
    drive:{bpm:92,root:45,chords:[[0,4,7,11],[5,9,12,16],[7,11,14,18],[2,5,9,12]],melody:[12,null,14,null,16,null,14,null,12,null,9,null,11,null,9,null],cb:12,bass:1,pulse:0},
    work:{bpm:74,root:50,chords:[[0,4,7,11],[9,12,16,19],[5,9,12,16],[7,11,14,18]],melody:[14,null,null,11,null,null,9,null,11,null,null,14,null,null,9,null],cb:12,bass:0,pulse:0},
    sport:{bpm:128,root:45,chords:[[0,3,7,10],[5,8,12,15],[8,12,15,19],[7,10,14,17]],melody:[12,15,17,15,19,17,15,12,12,15,17,19,22,19,17,15],cb:8,bass:1,pulse:1},
    meditate:{bpm:60,root:50,chords:[[0,7,12,16],[0,5,12,17]],melody:[12,null,null,null,7,null,null,null],cb:20,bass:0,pulse:0},
    sleep:{bpm:58,root:48,chords:[[0,4,7,11],[5,9,12,16],[9,12,16,19],[7,11,14,16]],melody:[19,null,null,null,null,null,16,null,null,null,null,null,14,null,null,null],cb:16,bass:0,pulse:0},
    stress:{bpm:62,root:53,chords:[[0,4,7,12],[5,9,12,16],[2,5,9,12],[0,4,7,9]],melody:[12,null,null,null,9,null,null,null,7,null,null,null],cb:16,bass:0,pulse:0},
    overload:{bpm:54,root:48,chords:[[0,7,12]],melody:[],cb:24,bass:0,pulse:0}
  };
  const midi=n=>440*Math.pow(2,(n-69)/12);
  function ensureAudio(){
    if(ac)return; ac=new(window.AudioContext||window.webkitAudioContext)();
    master=ac.createGain();master.gain.value=.0001;
    const comp=ac.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=2;comp.attack.value=.025;comp.release.value=.45;
    dry=ac.createGain();wet=ac.createGain();reverb=ac.createConvolver();
    const len=Math.floor(ac.sampleRate*3.2),ir=ac.createBuffer(2,len,ac.sampleRate);
    for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.4)}
    reverb.buffer=ir;dry.gain.value=.75;wet.gain.value=.28;dry.connect(master);reverb.connect(wet).connect(master);master.connect(comp).connect(ac.destination);
  }
  function route(n){n.connect(dry);n.connect(reverb)}
  function clearMusic(){timers.forEach(x=>{clearTimeout(x);clearInterval(x)});timers=[];generation++}
  function env(g,t,p,d,a,r){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,p),t+a);g.gain.setValueAtTime(Math.max(.0002,p),Math.max(t+a+.01,t+d-r));g.gain.exponentialRampToValueAtTime(.0001,t+d)}
  function pad(note,level,duration,soft=true){
    if(!playing)return;const t=ac.currentTime,f=ac.createBiquadFilter(),g=ac.createGain();f.type='lowpass';f.frequency.value=soft?1050:1550;f.Q.value=.35;env(g,t,level,duration,soft?.8:.18,Math.min(2.2,duration*.35));
    [-7,0,7].forEach((det,i)=>{const o=ac.createOscillator(),og=ac.createGain();o.type=i===1?'sine':'triangle';o.frequency.value=midi(note);o.detune.value=det;og.gain.value=i===1?.54:.23;o.connect(og).connect(f);o.start(t);o.stop(t+duration+.05)});f.connect(g);route(g);
  }
  function chord(notes,level,duration,soft=true){notes.forEach((n,i)=>{pad(n,level/notes.length,duration,soft);if(i<3)pad(n+12,level/(notes.length*7),duration*.9,true)})}
  function piano(note,level=.02,duration=1.6){
    if(!playing)return;const t=ac.currentTime,g=ac.createGain(),o1=ac.createOscillator(),o2=ac.createOscillator(),hg=ac.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(level,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o1.type=o2.type='sine';o1.frequency.value=midi(note);o2.frequency.value=midi(note)*2.002;hg.gain.setValueAtTime(.20,t);hg.gain.exponentialRampToValueAtTime(.001,t+Math.min(.55,duration));o1.connect(g);o2.connect(hg).connect(g);route(g);o1.start(t);o2.start(t);o1.stop(t+duration+.04);o2.stop(t+duration+.04);
  }
  function pluck(note,level=.02,duration=.42){
    if(!playing)return;const t=ac.currentTime,o=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain();o.type='triangle';o.frequency.value=midi(note);f.type='lowpass';f.frequency.setValueAtTime(2200,t);f.frequency.exponentialRampToValueAtTime(650,t+duration);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(level,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(f).connect(g);route(g);o.start(t);o.stop(t+duration+.03);
  }
  function bass(note,level=.025,duration=.3){if(!playing)return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter();o.type='sine';o.frequency.value=midi(note);f.type='lowpass';f.frequency.value=320;env(g,t,level,duration,.01,.20);o.connect(f).connect(g);route(g);o.start(t);o.stop(t+duration+.04)}
  function pulse(level=.008){if(!playing)return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(420,t);o.frequency.exponentialRampToValueAtTime(220,t+.055);g.gain.setValueAtTime(level,t);g.gain.exponentialRampToValueAtTime(.0001,t+.07);o.connect(g);route(g);o.start(t);o.stop(t+.08)}
  function startSequence(key){
    clearMusic();const token=generation,p=MUSIC[key],s=(+stim.value)/100,beat=60000/p.bpm;let ci=0,step=0;
    function chords(){if(!playing||token!==generation)return;const notes=p.chords[ci++%p.chords.length].map(x=>p.root+x);let level=key==='overload'?.012*s:key==='sleep'?.045:key==='work'?.050:.055+s*.025;chord(notes,level,beat*p.cb/1000*1.06,!['routine','sport'].includes(key))}
    chords();timers.push(setInterval(chords,beat*p.cb));
    function seq(){if(!playing||token!==generation)return;if(p.melody.length){const off=p.melody[step%p.melody.length];if(off!==null){const n=p.root+off;if(key==='routine'&&s>.18)pluck(n,.009+s*.020,.45);else if(key==='sport'&&s>.12)pluck(n,.011+s*.024,.30);else if(key==='drive'&&s>.20)piano(n,.005+s*.009,1.1);else if(key==='work'&&s>.10)piano(n,.0045+s*.007,1.7);else if(key==='sleep')piano(n,.0035+s*.004,2.8);else if(key==='stress'||key==='meditate')piano(n,.0038+s*.005,2.2)}}if(p.bass&&s>.42&&step%4===0)bass(p.root-12,.010+s*.022,.32);if(p.pulse&&s>.62&&step%2===1)pulse(.002+s*.006);step++}
    seq();timers.push(setInterval(seq,beat/2));
  }
  function applyProfile(){
    if(!ac)return;const s=(+stim.value)/100;let volume=.42+s*.18,rv=.28;if(currentKey==='routine'){volume=.44+s*.20;rv=.22}if(currentKey==='work'){volume=.40+s*.13;rv=.31}if(currentKey==='sleep'){volume=.32+s*.10;rv=.44}if(currentKey==='stress'||currentKey==='meditate'){volume=.34+s*.10;rv=.40}if(currentKey==='overload'){volume=.12+s*.18;rv=.45}
    master.gain.setTargetAtTime(playing?volume:.0001,ac.currentTime,.18);wet.gain.setTargetAtTime(rv,ac.currentTime,.2);dry.gain.setTargetAtTime(1-rv*.55,ac.currentTime,.2);if(playing)startSequence(currentKey);
    const labels={routine:'chill groove · generative melody',drive:'steady harmony · soft piano',work:'warm chords · sparse electric piano',sport:'melodic groove · bass · pulse',meditate:'ambient harmony',sleep:'slow pads · distant piano',stress:'warm harmony · sparse piano',overload:s<.15?'почти тишина':'minimal tonal ambient'};nowLabel.textContent=labels[currentKey];
  }
  async function startAudio(){ensureAudio();if(ac.state==='suspended')await ac.resume();playing=true;playBtn.dataset.playing='1';applyProfile()}
  function stopAudio(){playing=false;playBtn.dataset.playing='0';clearMusic();if(ac)master.gain.setTargetAtTime(.0001,ac.currentTime,.15);nowLabel.textContent='на паузе'}
  playBtn.onclick=()=>playing?stopAudio():startAudio();

  // ----- visual field -----
  const canvas=document.getElementById('waves'), g=canvas.getContext('2d');
  let W=0,H=0,DPR=1,last=performance.now(),phase=0,energy=0;
  function resize(){
    DPR=Math.min(2,devicePixelRatio||1);
    W=canvas.width=Math.floor(innerWidth*DPR); H=canvas.height=Math.floor(innerHeight*DPR);
    canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';
  }
  addEventListener('resize',resize,{passive:true});resize();

  function contour(cx,cy,r,t,amp,points=160){
    g.beginPath();
    for(let i=0;i<=points;i++){
      const a=i/points*Math.PI*2;
      const wobble=Math.sin(a*2+t)*amp*.5+Math.sin(a*3-t*.7)*amp*.35+Math.sin(a*5+t*.35)*amp*.15;
      const rr=r+wobble;
      const x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;
      i?g.lineTo(x,y):g.moveTo(x,y);
    }
    g.closePath();
  }
  function draw(now){
    const dt=Math.min(40,now-last);last=now;
    const target=playing?(.22+(+stim.value/100)*.78):0;
    energy+=(target-energy)*(playing?.04:.025);
    phase+=dt*.0012*(.55+(+stim.value/100)*1.1);
    g.clearRect(0,0,W,H);
    if(energy>.002){
      const cx=W/2,cy=H/2,min=Math.min(W,H);
      const grad=g.createRadialGradient(cx,cy,min*.02,cx,cy,min*.40);
      grad.addColorStop(0,`rgba(255,255,255,${.028*energy})`);
      grad.addColorStop(1,'rgba(255,255,255,0)');
      g.fillStyle=grad;g.fillRect(0,0,W,H);
      [0.13,.18,.24,.31].forEach((base,i)=>{
        const breathe=(Math.sin(phase*(.7+i*.08)+i)+1)/2;
        contour(cx,cy,min*(base+breathe*.018),phase*(.8-i*.08)+i, (8+i*4)*DPR*energy);
        g.strokeStyle=`rgba(247,247,245,${(.13-i*.022)*energy})`;
        g.lineWidth=(1-i*.12)*DPR;g.stroke();
      });
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  // Open deep work on hash, e.g. /v2/#work
  const hash=location.hash.replace('#','');
  if(MODES[hash]) openMode(hash);
})();
</script>
